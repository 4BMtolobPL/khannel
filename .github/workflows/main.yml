name: 'ci'

# push/PR마다 대상 OS(Linux, macOS)에서 빌드·테스트·clippy를 돌린다.
# 릴리스 패키징(macOS dmg, Fedora RPM)은 release.yml이 `v*` 태그에서 한다.

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: ['ubuntu-24.04', 'macos-latest']

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        # gpui(X11/Wayland, 폰트) + irc TLS(openssl)에 필요한 시스템 라이브러리
        run: |
          sudo apt update
          sudo apt install -y pkg-config libssl-dev libfontconfig-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-xcb-dev

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --workspace --locked
