[workspace]
resolver = "2"
members = ["crates/kirc-core", "crates/kirc-app"]

# 공통 의존성 정의 (member crates에서 workspace = true로 상속)
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3"
irc = "1.1.0"
chrono = "0.4.43"
thiserror = "2"
uuid = { version = "1.21.0", features = ["serde", "v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
