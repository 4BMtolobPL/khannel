[workspace]
resolver = "3"
members = ["crates/khannel-core", "crates/khannel"]

# 공통 패키지 메타데이터 (member crates에서 `<필드>.workspace = true`로 상속)
[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Talmo Kim"]
repository = "https://github.com/4BMtolobPL/khannel"
homepage = "https://github.com/4BMtolobPL/khannel"

# 배포 빌드: 크기 축소 (thin LTO + 심볼 제거)
[profile.release]
lto = "thin"
strip = true

# 공통 의존성 정의 (member crates에서 workspace = true로 상속)
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3"
# 기본 feature를 끈다:
# - ctcp: 크레이트가 CTCP에 자동 응답해 우리 응답과 중복되고, 채널 CTCP엔 채널 전체로 응답한다
# - channel-lists: 376(MOTD 끝)에 기억한 채널로 JOIN을 다시 보내 자동 재입장과 중복된다
# - toml_config: Config는 코드에서 만든다
# encoding은 필수 — 없으면 UTF-8이 아닌 줄 하나에 스트림 에러가 나 연결이 끊긴다
irc = { version = "1.1.0", default-features = false, features = ["tls-native", "encoding"] }
chrono = "0.4.43"
thiserror = "2"
uuid = { version = "1.21.0", features = ["serde", "v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
