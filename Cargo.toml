[workspace]
resolver = "3"
members = ["crates/khannel-core", "crates/khannel"]

# 공통 패키지 메타데이터 (member crates에서 `<필드>.workspace = true`로 상속)
[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
authors = ["Talmo Kim"]
repository = "https://github.com/4BMtolobPL/khannel"
homepage = "https://github.com/4BMtolobPL/khannel"

# 배포 빌드: 크기 축소 (thin LTO + 심볼 제거)
[profile.release]
lto = "thin"
strip = true

# 공통 의존성 정의 (member crates에서 workspace = true로 상속)
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
futures = "0.3"
irc = "1.1.0"
chrono = "0.4.43"
thiserror = "2"
uuid = { version = "1.21.0", features = ["serde", "v7"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
