# cargo-about 설정 — 배포 바이너리에 포함되는 의존성의 라이선스 고지(THIRD_PARTY_NOTICES.md) 생성.
#   cargo about generate about.hbs -o THIRD_PARTY_NOTICES.md
#
# `accepted`의 순서는 "A OR B" 표기에서 고를 라이선스의 우선순위다 (MIT → Apache-2.0 → …).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "MIT-0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "NCSA",
]

# 배포 대상 플랫폼만 (macOS Apple Silicon, Linux x86_64)
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]

# 빌드 전용/개발용 의존성은 배포 바이너리에 포함되지 않는다
ignore-build-dependencies = true
ignore-dev-dependencies = true
